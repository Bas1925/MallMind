# MallMind — Alembic configuration
# See docs/decisions/006-alembic-migration-strategy.md for the "why".

[alembic]
# Path to migration scripts
script_location = alembic

# Template used for new migration filenames: <date>_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend the backend/ dir to sys.path so env.py can `import app.models`
prepend_sys_path = .
path_separator = os

# Timezone for file_template (UTC avoids laptop-vs-CI drift)
timezone = UTC

# Fail if a model has no __tablename__ etc.
sqlalchemy.url =

# ---- Loggers ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
