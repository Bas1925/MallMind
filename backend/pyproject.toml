[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mallmind-backend"
version = "0.0.1"
description = "MallMind backend — FastAPI + PostgreSQL + pgvector"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    # Required by SQLAlchemy's async bridge when any sync code (including
    # Alembic env.py) touches an async session.
    "greenlet>=3.0,<4.0",
    # Sync driver used ONLY by Alembic's sync migration context. The app
    # itself uses asyncpg.
    "psycopg[binary]>=3.2,<4.0",
    # Local multilingual embeddings. Optional at runtime: if the import fails,
    # search degrades to lexical and the assistant still answers from the database.
    "fastembed>=0.6,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "coverage[toml]>=7.6,<8.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL with pgvector",
]
filterwarnings = [
    # SQLAlchemy 2.x occasionally emits DeprecationWarnings from asyncpg;
    # silence only if we see them in CI to avoid hiding real issues.
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Rule set:
#   E/W  = pycodestyle, F = pyflakes, I = isort, N = pep8-naming,
#   UP   = pyupgrade, B = bugbear, BLE = blind-except (we deliberately
#   opt out in two places with a documented reason), SIM = simplify,
#   RUF = ruff-native.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    # B008: `Depends()` in function defaults is THE idiomatic FastAPI
    # pattern. The rule is a general-Python warning that doesn't apply here.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests get a little leniency for fixture names and long param lines.
"tests/**" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
