name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  check:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Deterministic install. `npm ci` requires a lockfile and fails
      # loudly if package.json and package-lock.json disagree.
      - name: Install dependencies (ci)
        run: npm ci

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: TypeScript (strict, --noEmit)
        run: npm run typecheck

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Vitest (Testing Library)
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
