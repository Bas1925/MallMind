name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "mallmind/frontend/**"
      - "mallmind/.github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "mallmind/frontend/**"
      - "mallmind/.github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: mallmind/frontend

jobs:
  check:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mallmind/frontend/package-lock.json

      # Deterministic install. `npm ci` requires a lockfile and fails
      # loudly if package.json and package-lock.json disagree.
      - name: Install dependencies (ci)
        run: npm ci

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: TypeScript (strict, --noEmit)
        run: npm run typecheck

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Vitest (Testing Library)
        run: npm test
