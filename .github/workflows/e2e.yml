name: e2e-navigation

on:
  push:
    branches: [main]
    paths:
      - "mallmind/frontend/**"
      - "mallmind/backend/**"
      - "mallmind/.github/workflows/e2e.yml"
  pull_request:
    paths:
      - "mallmind/frontend/**"
      - "mallmind/backend/**"
      - "mallmind/.github/workflows/e2e.yml"

jobs:
  playwright:
    name: Real backend route E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mallmind
          POSTGRES_PASSWORD: mallmind_ci
          POSTGRES_DB: mallmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mallmind -d mallmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://mallmind:mallmind_ci@localhost:5432/mallmind
      ENVIRONMENT: ci
      LOG_LEVEL: WARNING
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mallmind/backend/requirements-dev-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mallmind/frontend/package-lock.json

      - name: Install pgvector + pg_trgm
        env:
          PGPASSWORD: mallmind_ci
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U mallmind -d mallmind -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Install backend
        working-directory: mallmind/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev-lock.txt
          pip install --no-deps .
          alembic upgrade head
          python -m app.seed --force

      - name: Start API
        working-directory: mallmind/backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/mallmind-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          echo "API failed to start" >&2
          cat /tmp/mallmind-api.log
          exit 1

      - name: Install frontend
        working-directory: mallmind/frontend
        run: npm ci

      - name: Production build
        working-directory: mallmind/frontend
        run: npm run build

      - name: Playwright Chromium
        working-directory: mallmind/frontend
        run: npx playwright install --with-deps chromium

      - name: Route E2E
        working-directory: mallmind/frontend
        run: npm run e2e
